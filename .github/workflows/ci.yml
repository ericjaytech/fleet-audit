name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install --editable '.[dev]'

      - name: Run Python tests
        run: python -m pytest

      - name: Check Python formatting
        if: matrix.python-version == '3.14'
        run: python -m ruff format --check .

      - name: Lint Python
        if: matrix.python-version == '3.14'
        run: python -m ruff check .

      - name: Build distribution
        if: matrix.python-version == '3.14'
        run: python -m build

  shell:
    name: Shell quality and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shell tools
        run: sudo apt-get update && sudo apt-get install --yes bats shellcheck shfmt

      - name: Check shell syntax and safety
        run: shellcheck src/fleet_audit/collectors/*.sh

      - name: Check shell formatting
        run: shfmt --diff --indent 4 src/fleet_audit/collectors/*.sh

      - name: Run shell tests
        run: bats tests/bats
